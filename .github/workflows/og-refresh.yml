# Regenerates og.png (the social-share schedule image) from the live custody
# calendar every Thursday morning, so Friday's texted link always previews
# the fresh two-week schedule. Also runs on demand and after content pushes.
name: Refresh share image
on:
  schedule:
    - cron: '0 12 * * 4'   # Thursdays 12:00 UTC = 7am Central
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['og.png']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: scripts/og
      - run: node render.mjs
        working-directory: scripts/og
      - name: Commit if changed
        run: |
          if ! git diff --quiet og.png; then
            git config user.name "og-refresh-bot"
            git config user.email "actions@github.com"
            git add og.png
            git commit -m "Refresh share image ($(date +%m/%d/%Y))"
            git push
          else
            echo "og.png unchanged"
          fi
